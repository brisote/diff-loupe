name: Bug report
description: Something in Diffloupe does not work as it should.
labels: ["bug"]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you did, what you expected, and what Diffloupe did instead.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Open a repository with ...
        2. Click ...
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Diffloupe version
      description: In the settings menu, choose About Diffloupe.
    validations:
      required: true
  - type: input
    id: macos
    attributes:
      label: macOS version
    validations:
      required: true
