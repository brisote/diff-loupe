name: CI

on:
  push:
    branches: ["main"]
    paths-ignore: ["website/**", ".github/workflows/website.yml", ".github/workflows/website-deploy.yml"]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: false

jobs:
  rust:
    name: Rust
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      CARGO_PROFILE_DEV_DEBUG: "0"
      CARGO_PROFILE_TEST_DEBUG: "0"
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - name: Rust toolchain
        run: rustup show active-toolchain || rustup toolchain install

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: backend
          cache-on-failure: true
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: System packages for the Tauri shell
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libwebkit2gtk-4.1-dev libgtk-3-dev libxdo-dev libssl-dev

      - name: Rust format
        run: cargo fmt --all --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Rust tests
        run: |
          rm -rf ../frontend/src/api/generated
          cargo test --workspace

      - name: Dev bridge for the UI tests
        run: cargo build -p diffloupe-devbridge

      - name: Generated types are current
        working-directory: .
        run: |
          git status --porcelain frontend/src/api/generated
          test -z "$(git status --porcelain frontend/src/api/generated)"

      - uses: actions/upload-artifact@v4
        with:
          name: devbridge
          path: backend/target/debug/diffloupe-devbridge
          retention-days: 1

  ui:
    name: UI
    needs: rust
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    container:
      image: mcr.microsoft.com/playwright:v1.64.1-noble
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install packages
        run: pnpm install --frozen-lockfile

      - name: UI build
        run: pnpm build

      - name: Biome
        run: pnpm biome ci .

      - name: TypeScript
        run: pnpm --dir frontend typecheck

      - name: Vitest
        run: pnpm --dir frontend test

      - name: Script tests
        run: |
          python3 -m unittest discover -s backend/scripts/tests -t backend/scripts/tests
          python3 -m unittest discover -s website/scripts/tests -t website/scripts/tests

      - uses: actions/download-artifact@v4
        with:
          name: devbridge
          path: backend/target/debug

      - name: Playwright
        run: |
          chmod +x backend/target/debug/diffloupe-devbridge
          pnpm --dir frontend e2e

      - name: Keep the Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: frontend/playwright-report
          retention-days: 7
