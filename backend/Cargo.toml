[workspace]
resolver = "3"
members = ["core", "devbridge", "app"]

[workspace.package]
version = "0.2.1"
edition = "2024"
publish = false

[workspace.dependencies]
diffloupe-core = { path = "core" }
gix = "0.89"
rusqlite = { version = "0.40", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
ts-rs = "12"
tempfile = "3"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "sync", "io-util"] }
tokio-tungstenite = "0.30"
futures-util = "0.3"
clap = { version = "4", features = ["derive"] }
imara-diff = "0.2"
notify = "8.2"
rustix = { version = "1.1", features = ["process"] }
portable-pty = "0.9"
sha2 = "0.10"

[workspace.lints.clippy]
unwrap_used = "warn"

[profile.dev.package."*"]
opt-level = 2
